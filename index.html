<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanji">
<title>Kanji</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--bg:#f2f0ea;--ink:#1b2440;--soft:#5b6482;--line:#c9cbd6;--hit:#2c3f8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a30;--ink:#e9ecf6;--soft:#9aa3c4;--line:#2d3556;--hit:#9db0ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 24px;min-height:100%}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;max-width:420px}
.k{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:min(58vw,240px);line-height:1.05;margin:0}
.arti{font-size:1.6rem;font-weight:500;margin:10px 0 18px}
.baca{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:1.05rem;margin:0 0 22px}
.baca dt{color:var(--soft)}
.baca dd{margin:0;font-weight:500}
.contoh{border-top:1px solid var(--line);padding-top:16px;width:100%;font-size:1.05rem}
.contoh b{font-family:"Shippori Mincho",serif;font-size:1.5rem;color:var(--hit)}
footer{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--soft);padding-top:14px}
.prev{display:flex;gap:10px;font-family:"Shippori Mincho",serif;font-size:1.4rem}
</style>
</head>
<body>
<main>
  <p class="k" id="k"></p>
  <p class="arti" id="arti"></p>
  <dl class="baca">
    <dt>On</dt><dd id="on"></dd>
    <dt>Kun</dt><dd id="kun"></dd>
  </dl>
  <p class="contoh" id="contoh"></p>
</main>
<footer>
  <span class="prev" id="prev" aria-label="Kanji sebelumnya"></span>
  <span id="next"></span>
</footer>
<script>
// [kanji, on, kun, arti, kata, bacaan, arti kata]
var D=[
["日","ニチ・ジツ","ひ・か","hari, matahari","日本","にほん","Jepang"],
["月","ゲツ・ガツ","つき","bulan","月曜日","げつようび","hari Senin"],
["火","カ","ひ","api","火曜日","かようび","hari Selasa"],
["水","スイ","みず","air","水曜日","すいようび","hari Rabu"],
["木","モク","き","pohon, kayu","木曜日","もくようび","hari Kamis"],
["金","キン","かね","emas, uang","お金","おかね","uang"],
["土","ド","つち","tanah","土曜日","どようび","hari Sabtu"],
["人","ジン・ニン","ひと","orang","日本人","にほんじん","orang Jepang"],
["大","ダイ","おお(きい)","besar","大学","だいがく","universitas"],
["小","ショウ","ちい(さい)","kecil","小さい","ちいさい","kecil"],
["中","チュウ","なか","tengah, dalam","中国","ちゅうごく","Tiongkok"],
["山","サン","やま","gunung","富士山","ふじさん","Gunung Fuji"],
["川","セン","かわ","sungai","川","かわ","sungai"],
["田","デン","た","sawah","田中","たなか","Tanaka (nama)"],
["上","ジョウ","うえ","atas","上","うえ","atas"],
["下","カ","した","bawah","下","した","bawah"],
["学","ガク","まな(ぶ)","belajar","学生","がくせい","pelajar"],
["生","セイ","い(きる)・う(まれる)","hidup, lahir","先生","せんせい","guru"],
["先","セン","さき","dulu, depan","先月","せんげつ","bulan lalu"],
["私","シ","わたし","saya","私","わたし","saya"],
["年","ネン","とし","tahun","今年","ことし","tahun ini"],
["今","コン","いま","sekarang","今","いま","sekarang"],
["何","カ","なに・なん","apa","何時","なんじ","jam berapa"],
["時","ジ","とき","waktu, jam","時間","じかん","waktu"],
["分","ブン・フン","わ(かる)","menit, paham","分かる","わかる","mengerti"],
["半","ハン","なか(ば)","setengah","半分","はんぶん","separuh"],
["毎","マイ","—","setiap","毎日","まいにち","setiap hari"],
["食","ショク","た(べる)","makan","食べる","たべる","makan"],
["飲","イン","の(む)","minum","飲む","のむ","minum"],
["見","ケン","み(る)","melihat","見る","みる","melihat"],
["行","コウ・ギョウ","い(く)","pergi","行く","いく","pergi"],
["来","ライ","く(る)","datang","来週","らいしゅう","minggu depan"],
["本","ホン","もと","buku, asal","本","ほん","buku"],
["車","シャ","くるま","mobil","電車","でんしゃ","kereta listrik"],
["電","デン","—","listrik","電話","でんわ","telepon"],
["語","ゴ","かた(る)","bahasa","日本語","にほんご","bahasa Jepang"],
["父","フ","ちち","ayah","父","ちち","ayah saya"],
["母","ボ","はは","ibu","母","はは","ibu saya"],
["友","ユウ","とも","teman","友達","ともだち","teman"]
];
var H=43200000, n=D.length;
function slot(){var t=Date.now()-new Date().getTimezoneOffset()*60000;return Math.floor(t/H);}
function show(){
  var s=slot(), i=s%n, d=D[i], el=function(x){return document.getElementById(x)};
  el("k").textContent=d[0]; el("arti").textContent=d[3];
  el("on").textContent=d[1]; el("kun").textContent=d[2];
  el("contoh").innerHTML="<b>"+d[4]+"</b>　"+d[5]+"　"+d[6];
  var p="";for(var j=1;j<=3;j++){p+="<span>"+D[(s-j%n+n*3)%n][0]+"</span>";}
  el("prev").innerHTML=p;
  var nxt=new Date((s+1)*H+new Date().getTimezoneOffset()*60000);
  el("next").textContent="Ganti pukul "+("0"+nxt.getHours()).slice(-2)+"."+"00";
  setTimeout(show,Math.max(1000,(s+1)*H-(Date.now()-new Date().getTimezoneOffset()*60000))+500);
}
show();
document.addEventListener("visibilitychange",function(){if(!document.hidden)show();});
</script>
</body>
</html>
